server {
    listen 80;
    listen [::]:80;
    server_name _;                       # ← replace with your domain, then run certbot

    # ---- security headers -------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---- compression ------------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 512;

    client_max_body_size 25m;

    # ---- SPA (built dashboard) --------------------------------------------
    root /opt/tap/app/frontend/dist;
    index index.html;

    location /assets/ {
        # single Cache-Control header (hashed filenames => immutable)
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- API reverse proxy (never expose :8000 publicly) -------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # ---- OpenAPI / Swagger (restrict if you do not want it public) ---------
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/api/v1/health;
        access_log off;
    }

    # ---- deny hidden files -------------------------------------------------
    location ~ /\.(?!well-known) {
        deny all;
    }
}

# After `certbot --nginx -d your-domain.com`, certbot inserts the TLS (443) block
# and the HTTP→HTTPS redirect automatically.
