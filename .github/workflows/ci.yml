name: Telegram Auto Publisher CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    name: Backend & Database Suite (Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify no secrets committed
        run: |
          test ! -f .env
          ! find . -name "*.session" -not -path "./.git/*" | grep -q .
      - name: Run Alembic migrations & Pytest suite
        working-directory: backend
        run: |
          pytest -v

  frontend-tests:
    name: Frontend Build & Functional Suite (Vitest + TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck, Test & Build
        working-directory: frontend
        run: |
          npm run test -- --run
          npm run build
